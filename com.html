<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Galeri Audio Halu</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
}

.Tag {
  color:green;
  text-shadow: white;
}

header{
    padding:15px;
    text-align:center;
    background:transparent;
}

input{
    width:90%;
    max-width:400px;
    padding:10px;
    border:none;
    border-radius:5px;
    outline:none;
    margin-top:2px;
    background: #222;
    color:white;
}

.gallery{
    padding:20px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#1a1a1a;
    border-radius:10px;
    padding:15px;
    box-shadow:0 0 10px green;
}

.card h3{
    margin-bottom:8px;
    font-size:15px;
    color:green;
    text-shadow:0 0 10px green;
}

audio{
    width:100%;
    height:45px;
    border-radius:22px;
    background:#white;
    color:white;
    box-shadow:
    0 0 15px green;
}
</style>
</head>

<body>

<header>
    <h2 class="Tag">Galeri Audio RIFQY</h2>
    <input type="text" id="search" placeholder="Cari lagu..." onkeyup="cariLagu()">
</header>

<div class="gallery" id="listLagu">

    <!-- TAMBAH LAGU DI SINI -->
    <div class="card" data-title="Cosmic ligt">
        <h3>Cosmic light</h3>
        <audio controls>
            <source src="CosmicLight.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" data-title="yin yang harmony">
        <h3>yin yang harmony</h3>
        <audio controls>
            <source src="Yin-yang-harmony.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" data-title="yin yang harmony v2">
        <h3>yin yang harmony v2</h3>
        <audio controls>
            <source src="YIN-yang-harmony_V2.mp3" type="audio/mpeg">
        </audio>
    </div>

</div>

<script>
function cariLagu(){
    let input = document.getElementById("search").value.toLowerCase();
    let lagu = document.querySelectorAll(".card");

    lagu.forEach(item=>{
        let judul = item.getAttribute("data-title").toLowerCase();
        item.style.display = judul.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
