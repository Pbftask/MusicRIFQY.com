<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri Audio Halu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* HEADER */
header{
    padding:20px 15px;
    text-align:center;
    position:sticky;
    top:0;
    background:rgba(17,17,17,0.95);
    backdrop-filter:blur(10px);
    z-index:100;
}

.Tag{
    color:#00ff66;
    font-size:28px;
    margin-bottom:15px;
    text-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66;
}

/* SEARCH */
input{
    width:100%;
    max-width:420px;
    padding:13px 15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#1f1f1f;
    color:white;
    font-size:15px;
    border:1px solid #00ff66;
    box-shadow:0 0 10px rgba(0,255,100,0.3);
}

input::placeholder{
    color:#999;
}

/* GRID */
.gallery{
    width:100%;
    padding:15px;
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
}

/* CARD */
.card{
    background:linear-gradient(145deg,#1a1a1a,#141414);
    border-radius:18px;
    padding:15px;
    border:1px solid rgba(0,255,100,0.25);
    box-shadow:
    0 0 15px rgba(0,255,100,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:
    0 0 20px rgba(0,255,100,0.35);
}

.card h3{
    margin-bottom:12px;
    font-size:16px;
    color:#00ff66;
    text-shadow:0 0 10px #00ff66;
    word-break:break-word;
}

/* AUDIO PLAYER */
audio{
    width:100%;
    height:50px;
    border-radius:30px;
    overflow:hidden;
    background:#222;
    box-shadow:
    0 0 12px rgba(0,255,100,0.3);
}

/* HP KECIL */
@media(max-width:480px){

    .Tag{
        font-size:24px;
    }

    .card{
        padding:13px;
        border-radius:15px;
    }

    .card h3{
        font-size:15px;
    }

    audio{
        height:48px;
    }
}

/* TABLET */
@media(min-width:700px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
    }
}

/* DESKTOP */
@media(min-width:1000px){
    .gallery{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<header>
    <h2 class="Tag">Galeri Audio RIFQY</h2>

    <input 
    type="text" 
    id="search" 
    placeholder="Cari lagu..." 
    onkeyup="cariLagu()">
</header>

<div class="gallery" id="listLagu">

    <div class="card" data-title="Cosmic light">
        <h3>Cosmic Light</h3>

        <audio controls>
            <source src="CosmicLight.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" data-title="yin yang harmony">
        <h3>Yin Yang Harmony</h3>

        <audio controls>
            <source src="Yin-yang-harmony.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="card" data-title="yin yang harmony v2">
        <h3>Yin Yang Harmony V2</h3>

        <audio controls>
            <source src="YIN-yang-harmony_V2.mp3" type="audio/mpeg">
        </audio>
    </div>

</div>

<script>
function cariLagu(){

    let input =
    document
    .getElementById("search")
    .value
    .toLowerCase();

    let lagu =
    document
    .querySelectorAll(".card");

    lagu.forEach(item=>{

        let judul =
        item
        .getAttribute("data-title")
        .toLowerCase();

        item.style.display =
        judul.includes(input)
        ? "block"
        : "none";

    });
}
</script>

</body>
</html>
